server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ES modules need the correct MIME type.
    types {
        text/html      html;
        text/css       css;
        application/javascript js mjs;
        image/svg+xml  svg;
        application/json json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the app shell during a demo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
